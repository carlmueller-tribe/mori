[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mori"
version = "0.1.0"
description = "The cognitive environment for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Carl Mueller" },
]
dependencies = [
    "pydantic>=2.13.4,<3.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.0",
    "anyio>=4.0,<5.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.101.0,<1.0"]
openai = ["openai>=2.36.0,<3.0"]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
langgraph = ["langgraph>=1.2.0"]
voyageai = ["voyageai>=0.2"]
cohere = ["cohere>=5.0"]
local-embed = ["sentence-transformers>=5.5.0"]
otlp = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=2.1.0",
    "pre-commit>=4.0",
    "commitizen>=4.16.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402", "E501"]
"tests/*" = ["E402", "E501", "F841", "B017"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "voyageai.*",
    "openai.*",
    "cohere.*",
    "langgraph.*",
    "opentelemetry.*",
    "sentence_transformers.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mori.model.anthropic"]
warn_unused_ignores = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
